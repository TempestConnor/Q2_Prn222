<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equipment List</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; color: #202428; background: #fff; font: 16px/1.5 Arial, sans-serif; }
        main { width: min(1120px, calc(100% - 48px)); margin: 32px auto; }
        h1 { margin: 0 0 12px; font-size: 32px; line-height: 1.25; }
        a { color: #1655b0; text-underline-offset: 2px; }
        .add-link { margin: 0 0 18px; }
        .filter-form { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        select, button { min-height: 40px; border: 1px solid #777; border-radius: 2px; font: inherit; }
        select { min-width: 220px; padding: 6px 12px; color: inherit; background: #fff; }
        button { padding: 6px 20px; color: #111; background: #f3f3f3; cursor: pointer; }
        button:hover { background: #e7e7e7; }
        a:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid #1655b0; outline-offset: 3px; }
        .count { margin: 0 0 14px; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; min-width: 720px; border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 10px 12px; text-align: left; white-space: nowrap; }
        th { background: #eee; font-weight: 700; }
        #div_empty:not(:empty) { margin-top: 14px; }
        .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
        @media (max-width: 600px) {
            main { width: calc(100% - 32px); margin-top: 24px; }
            .filter-form { flex-wrap: wrap; }
            select { min-width: 180px; }
        }
    </style>
</head>
<body>
    <!-- Static UI reference for /Equipment/List. -->
    <main>
        <h1>Equipment List</h1>

        <p class="add-link">
            <a id="lnk_addNew" href="/Equipment/Create">Add New Equipment</a>
        </p>

        <form class="filter-form" method="get" action="/Equipment/List">
            <label class="visually-hidden" for="sl_filter">Group</label>
            <select id="sl_filter" name="groupId">
                <option id="opt_filter_all" value="" selected>All</option>
                <option id="opt_filter_1" value="1">North</option>
                <option id="opt_filter_2" value="2">South</option>
                <option id="opt_filter_3" value="3">West</option>
            </select>
            <button id="btn_filter" type="submit">Filter</button>
        </form>

        <p class="count">Items: <span id="span_count">5</span></p>

        <div class="table-scroll">
            <table id="tbl_items" aria-label="Lab equipment">
                <thead>
                    <tr>
                        <th scope="col">ItemId</th>
                        <th scope="col">Name</th>
                        <th scope="col">Group</th>
                        <th scope="col">Amount</th>
                        <th scope="col">EventDate</th>
                        <th scope="col">Status</th>
                    </tr>
                </thead>
                <tbody id="tbody_items">
                    <tr id="tr_1">
                        <td id="td_id_1">1</td>
                        <td id="td_name_1">Alpha</td>
                        <td id="td_group_1">North</td>
                        <td id="td_amount_1">10.00</td>
                        <td id="td_date_1">2026-03-01</td>
                        <td id="td_status_1">Pending</td>
                    </tr>
                    <tr id="tr_2">
                        <td id="td_id_2">2</td>
                        <td id="td_name_2">Beta</td>
                        <td id="td_group_2">South</td>
                        <td id="td_amount_2">20.00</td>
                        <td id="td_date_2">2026-03-02</td>
                        <td id="td_status_2">Approved</td>
                    </tr>
                    <tr id="tr_3">
                        <td id="td_id_3">3</td>
                        <td id="td_name_3">Alpine</td>
                        <td id="td_group_3">North</td>
                        <td id="td_amount_3">30.00</td>
                        <td id="td_date_3">2026-03-03</td>
                        <td id="td_status_3">Pending</td>
                    </tr>
                    <tr id="tr_4">
                        <td id="td_id_4">4</td>
                        <td id="td_name_4">Delta</td>
                        <td id="td_group_4">South</td>
                        <td id="td_amount_4">20.00</td>
                        <td id="td_date_4">2026-03-04</td>
                        <td id="td_status_4">Rejected</td>
                    </tr>
                    <tr id="tr_5">
                        <td id="td_id_5">5</td>
                        <td id="td_name_5">Echo</td>
                        <td id="td_group_5">South</td>
                        <td id="td_amount_5">0.00</td>
                        <td id="td_date_5">2026-03-05</td>
                        <td id="td_status_5">Pending</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="div_empty" role="status"></div>
    </main>
</body>
</html>
